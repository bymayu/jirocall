<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラーメン二郎 コールジェネレーター</title>
    <style>
        :root {
            --jiro-yellow: #ffee00;
            --jiro-black: #1a1a1a;
            --jiro-red: #d70000;
            --counter-wood: #3d2b1f;
            --text-white: #ffffff;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: var(--counter-wood);
            color: var(--jiro-black);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .noren-header {
            background-color: var(--jiro-red);
            color: var(--text-white);
            text-align: center;
            padding: 25px 10px;
            border-bottom: 8px solid var(--jiro-yellow);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .noren-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: 900;
        }

        .container {
            width: 95%;
            max-width: 480px;
            background-color: var(--jiro-yellow);
            padding: 0 0 40px 0;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid var(--jiro-black);
            margin-top: 10px;
        }

        .content-padding {
            padding: 0 15px;
        }

        /* 麺の量に関する注意書き */
        .noodle-notice {
            background-color: var(--jiro-black);
            color: var(--text-white);
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--jiro-red);
            font-size: 13px;
            line-height: 1.5;
        }

        .noodle-notice strong {
            color: var(--jiro-yellow);
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }

        .option-group {
            margin-bottom: 22px;
        }

        /* ラベルと説明文を横並びに */
        .option-label-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap; /* 画面が狭いときは折り返す */
        }

        .option-label {
            font-size: 15px;
            font-weight: 900;
            background-color: var(--jiro-black);
            color: var(--jiro-yellow);
            padding: 4px 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .option-description {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            line-height: 1.2;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .radio-group label {
            flex: 1;
            min-width: 70px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 12px 2px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--jiro-black);
            transition: all 0.1s ease;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: var(--jiro-red);
            color: var(--text-white);
            transform: translateY(-2px);
            box-shadow: 0 4px 0 var(--jiro-black);
        }

        .result-section {
            margin-top: 30px;
            background-color: var(--jiro-black);
            padding: 25px 15px;
            text-align: center;
            border-top: 6px solid var(--jiro-red);
        }

        .result-title {
            color: var(--text-white);
            font-size: 13px;
            margin-bottom: 12px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #call-result {
            color: var(--jiro-yellow);
            font-size: 32px;
            font-weight: 900;
            line-height: 1.2;
            min-height: 40px;
        }

        .footer-note {
            font-size: 11px;
            color: var(--jiro-black);
            margin-top: 20px;
            text-align: center;
            font-weight: 900;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="noren-header">
        <h1>二郎コール生成機</h1>
    </div>

    <div class="content-padding">
        <div class="noodle-notice">
            <strong>麺の量について</strong>
            「少なめ・半分」は【食券を渡す際】に伝えてください。コール時には変更不可。
        </div>

        <!-- ニンニク -->
        <div class="option-group">
            <div class="option-label-container">
                <span class="option-label">ニンニク</span>
                <span class="option-description">刻み生ニンニクを入れる</span>
            </div>
            <div class="radio-group">
                <input type="radio" id="n_nuki" name="ninniku" value="nuki" checked onchange="generateCall()">
                <label for="n_nuki">抜き</label>
                <input type="radio" id="n_sukuname" name="ninniku" value="sukuname" onchange="generateCall()">
                <label for="n_sukuname">少なめ</label>
                <input type="radio" id="n_futsu" name="ninniku" value="futsu" onchange="generateCall()">
                <label for="n_futsu">あり</label>
                <input type="radio" id="n_mashi" name="ninniku" value="mashi" onchange="generateCall()">
                <label for="n_mashi">マシ</label>
            </div>
        </div>

        <!-- ヤサイ -->
        <div class="option-group">
            <div class="option-label-container">
                <span class="option-label">ヤサイ</span>
                <span class="option-description">もやし・キャベツの量</span>
            </div>
            <div class="radio-group">
                <input type="radio" id="y_sukuname" name="yasai" value="sukuname" onchange="generateCall()">
                <label for="y_sukuname">少なめ</label>
                <input type="radio" id="y_futsu" name="yasai" value="futsu" checked onchange="generateCall()">
                <label for="y_futsu">普通</label>
                <input type="radio" id="y_mashi" name="yasai" value="mashi" onchange="generateCall()">
                <label for="y_mashi">マシ</label>
                <input type="radio" id="y_mashimashi" name="yasai" value="mashimashi" onchange="generateCall()">
                <label for="y_mashimashi">マシマシ</label>
            </div>
        </div>

        <!-- アブラ -->
        <div class="option-group">
            <div class="option-label-container">
                <span class="option-label">アブラ</span>
                <span class="option-description">背脂（塊）の追加</span>
            </div>
            <div class="radio-group">
                <input type="radio" id="a_nuki" name="abura" value="nuki" onchange="generateCall()">
                <label for="a_nuki">抜き</label>
                <input type="radio" id="a_futsu" name="abura" value="futsu" checked onchange="generateCall()">
                <label for="a_futsu">普通</label>
                <input type="radio" id="a_mashi" name="abura" value="mashi" onchange="generateCall()">
                <label for="a_mashi">マシ</label>
                <input type="radio" id="a_mashimashi" name="abura" value="mashimashi" onchange="generateCall()">
                <label for="a_mashimashi">マシマシ</label>
            </div>
        </div>

        <!-- カラメ -->
        <div class="option-group">
            <div class="option-label-container">
                <span class="option-label">カラメ</span>
                <span class="option-description">醤油だれ追加で濃い味に</span>
            </div>
            <div class="radio-group">
                <input type="radio" id="k_futsu" name="karame" value="futsu" checked onchange="generateCall()">
                <label for="k_futsu">普通</label>
                <input type="radio" id="k_mashi" name="karame" value="mashi" onchange="generateCall()">
                <label for="k_mashi">マシ</label>
                <input type="radio" id="k_mashimashi" name="karame" value="mashimashi" onchange="generateCall()">
                <label for="k_mashimashi">マシマシ</label>
            </div>
        </div>

        <div class="footer-note">
            店員さんに「ニンニク入れますか？」<br>
            と聞かれたら、下の文字を読み上げてください。
        </div>
    </div>

    <div class="result-section">
        <div class="result-title">コール内容</div>
        <div id="call-result">そのままで</div>
    </div>
</div>

<script>
    function generateCall() {
        const levels = {
            ninniku: document.querySelector('input[name="ninniku"]:checked').value,
            yasai: document.querySelector('input[name="yasai"]:checked').value,
            abura: document.querySelector('input[name="abura"]:checked').value,
            karame: document.querySelector('input[name="karame"]:checked').value
        };

        const names = { ninniku: 'ニンニク', yasai: 'ヤサイ', abura: 'アブラ', karame: 'カラメ' };

        // 全マシ
        if (levels.ninniku === "mashi" && levels.yasai === "mashi" && levels.abura === "mashi" && levels.karame === "mashi") {
            document.getElementById('call-result').innerText = "全マシ";
            return;
        }

        let callParts = [];
        let groups = { sukuname: [], mashi: [], mashimashi: [], nuki: [] };

        if (levels.ninniku === "futsu") {
            callParts.push("ニンニク");
        } else if (levels.ninniku !== "nuki") {
            groups[levels.ninniku].push(names.ninniku);
        }

        ['yasai', 'abura', 'karame'].forEach(item => {
            if (levels[item] !== "futsu") {
                groups[levels[item]].push(names[item]);
            }
        });

        if (groups.sukuname.length > 0) callParts.push(groups.sukuname.join("") + "少なめ");
        if (groups.mashi.length > 0) callParts.push(groups.mashi.join("") + "マシ");
        if (groups.mashimashi.length > 0) callParts.push(groups.mashimashi.join("") + "マシマシ");
        if (groups.nuki.length > 0) callParts.push(groups.nuki.join("") + "抜き");

        let finalCall = callParts.join(" ");

        if (finalCall === "") {
            finalCall = "そのままで";
        }

        document.getElementById('call-result').innerText = finalCall;
    }
    generateCall();
</script>

</body>
</html>
